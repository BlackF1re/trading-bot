services:
  trading-bot:
    build: .
    restart: unless-stopped
    environment:
      TRADE_SIZES_USDT: ${TRADE_SIZES_USDT:-10,25,50,100,250}
      POLL_INTERVAL_MS: ${POLL_INTERVAL_MS:-5000}
      MIN_SIGNAL_PCT: ${MIN_SIGNAL_PCT:-0.10}
      STON_SLIPPAGE_TOLERANCE: ${STON_SLIPPAGE_TOLERANCE:-0.005}
      DETECTION_TO_EXECUTION_MS: ${DETECTION_TO_EXECUTION_MS:-1200}
      BETWEEN_LEGS_MS: ${BETWEEN_LEGS_MS:-2500}
      EVENT_COOLDOWN_MS: ${EVENT_COOLDOWN_MS:-20000}
      ESTIMATED_GAS_PER_LEG_GRAM: ${ESTIMATED_GAS_PER_LEG_GRAM:-0.05}
      SAFETY_BUFFER_BPS: ${SAFETY_BUFFER_BPS:-10}
      USDT_MASTER: ${USDT_MASTER:-EQCxE6mUtQJKFnGfaROTKOt1lZbDiiX1kCixRv7Nw2Id_sDs}
      TON_V4_ENDPOINT: ${TON_V4_ENDPOINT:-https://mainnet-v4.tonhubapi.com}
      DATA_DIR: /app/data
      VERBOSE_ERRORS: ${VERBOSE_ERRORS:-false}
      UI_ENABLED: "true"
      UI_HOST: 0.0.0.0
      UI_PORT: 3000
      AUTO_OPEN_BROWSER: "false"
    ports:
      - "127.0.0.1:${UI_PORT:-3000}:3000"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
